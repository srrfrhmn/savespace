# Continuous deployment to Cloud Run (design doc §8.8).
#
# Runs after the ci workflow passes for a push to main. One image per commit.
# Order: build -> migrate (expand-only migrations, doc §9.3) -> worker -> api -> smoke test.
# Auth: GitHub OIDC -> Workload Identity Federation. No keys.
# Rollback: see infra/README.md.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Skip until infra/scripts/github-setup.sh has set the repository variables.
    if: >-
      vars.GCP_PROJECT_ID != '' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.api.outputs.url }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Tags are immutable. If this commit already has an image (a re-run or
      # a manual redeploy), deploy that image and skip the build.
      - name: Image name
        id: image
        run: |
          ref="${REGION}-docker.pkg.dev/${PROJECT}/savespace/app:${SHA}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if gcloud artifacts docker images describe "${ref}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image exists: ${ref}"
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists != 'true'

      - name: Build and push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # One plain manifest. Attestation manifests count toward the 0.5 GB free tier.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run migrations
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs update savespace-migrate --region "$REGION" --image "$IMAGE" --quiet
          gcloud run jobs execute savespace-migrate --region "$REGION" --wait --quiet

      - name: Update the worker job
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run jobs update savespace-worker --region "$REGION" --image "$IMAGE" --quiet

      - name: Deploy the api
        id: api
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run services update savespace-api --region "$REGION" --image "$IMAGE" --quiet
          url=$(gcloud run services describe savespace-api --region "$REGION" --format 'value(status.url)')
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          URL: ${{ steps.api.outputs.url }}
        run: |
          for path in /health /ready /; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-all-errors --retry-delay 3 "${URL}${path}"
            echo "ok ${path}"
          done
