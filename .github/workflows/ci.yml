# Continuous integration (design doc §14.2).
# Actions are pinned to commit SHAs. Dependabot updates them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, test, deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo xtask check-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  db:
    name: database migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: savespace
          POSTGRES_PASSWORD: savespace
          POSTGRES_DB: savespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U savespace"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://savespace:savespace@localhost:5432/savespace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: sqlx-cli
      - name: Apply migrations to a fresh database
        run: sqlx migrate run --source crates/platform-db/migrations
      - name: Check the schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '\dt app.*'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO app.jobs (kind, dedupe_key) VALUES ('ci.smoke', 'k1') RETURNING id;"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: Database tests (one new database per test, runtime role, RLS)
        run: cargo nextest run --workspace --locked --run-ignored only

  web:
    name: web (wasm, lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm wasm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is current (design doc §11.1)
        run: |
          pnpm gen:client
          git diff --exit-code -- clients/ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: WASM size budget (design doc §8.5)
        run: |
          size=$(gzip -9 -c bindings/wasm/pkg/savespace_core_bg.wasm | wc -c)
          echo "savespace-core WASM gzip size: ${size} bytes (budget 153600)"
          test "$size" -le 153600
      - name: Initial JS budget (design doc §8.5)
        run: |
          size=0
          for f in apps/web/dist/assets/*.js; do
            size=$((size + $(gzip -9 -c "$f" | wc -c)))
          done
          echo "Initial JS gzip size: ${size} bytes (budget 184320)"
          test "$size" -le 184320

  image:
    name: container image
    # main builds and pushes the image in the deploy workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false
          cache-from: type=gha

  infra:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
