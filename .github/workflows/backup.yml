# Daily encrypted database backup (design doc §8.8).
#
# pg_dump -> age (public key in infra/backup/age-recipients.txt) -> Cloud Storage.
# The plaintext dump never touches disk. The runner cannot read old backups:
# the backup service account can only create objects.
# Only the age private key (kept offline by the owner) can decrypt a backup.
# Restore: see infra/README.md.
name: backup

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.GCP_BACKUP_BUCKET != ''
    runs-on: ubuntu-24.04
    env:
      BUCKET: ${{ vars.GCP_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install age
        run: sudo apt-get install --yes --no-install-recommends age > /dev/null

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          url=$(gcloud secrets versions access latest --secret database-url-migrate)
          echo "::add-mask::${url}"
          # Same major version as the server. The image is pinned by digest.
          # The URL uses sslmode=verify-full. libpq checks the server
          # certificate against the runner's CA bundle.
          docker run --rm -e PGURL="${url}" \
            -e PGSSLROOTCERT=/etc/ssl/certs/ca-certificates.crt \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc \
            sh -c 'exec pg_dump --format=custom --no-owner "$PGURL"' \
            | age --encrypt --recipients-file infra/backup/age-recipients.txt > backup.dump.age
          size=$(stat --format=%s backup.dump.age)
          echo "Encrypted dump: ${size} bytes"
          test "${size}" -gt 1000

      - name: Upload
        run: |
          set -euo pipefail
          name="savespace/$(date -u +%Y/%m/%Y%m%dT%H%M%SZ).dump.age"
          # JSON API upload: needs only storage.objects.create.
          curl --fail --silent --show-error --output /dev/null \
            -X POST --data-binary @backup.dump.age \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/octet-stream" \
            "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=${name}"
          echo "Uploaded gs://${BUCKET}/${name}"
          rm -f backup.dump.age
