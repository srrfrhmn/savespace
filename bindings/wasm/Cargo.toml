[package]
name = "savespace-core-wasm"
description = "WASM bindings for savespace-core, used by the web app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
savespace-core.workspace = true
wasm-bindgen.workspace = true

# Not `workspace = true`: `#[wasm_bindgen]` expands to unsafe code, so this
# crate cannot deny `unsafe_code`. Hand-written unsafe is still not allowed.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
