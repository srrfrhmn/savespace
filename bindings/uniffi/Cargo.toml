[package]
name = "savespace-core-ffi"
description = "UniFFI bindings for savespace-core, used by the iOS (Swift) and Android (Kotlin) apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "savespace_core_ffi"

[dependencies]
savespace-core.workspace = true
thiserror.workspace = true
# Phase 2 adds a separate `uniffi-bindgen` tool crate (uniffi "cli" feature)
# to generate Swift and Kotlin sources. It is not here because the "cli"
# feature pulls in unmaintained crates (RUSTSEC-2026-0374, basic-toml).
uniffi.workspace = true

# Not `workspace = true`: UniFFI scaffolding expands to unsafe code.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
