# cargo-deny configuration (design doc §12.7 and §14.2).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory that affects a dependency.
version = 2
yanked = "deny"
ignore = [
    # rsa < 0.10.0 (Marvin Attack): timing leaks of an RSA *private* key during
    # decryption or signing. SaveSpace only verifies passkey signatures with
    # public keys (webauthn-rs, RS256) and holds no RSA private key.
    # webauthn-rs 0.6.2 (crypto-glue) cannot use rsa 0.10.0 yet. Remove this
    # entry when it can.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private key" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Add a license here only after review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Use rustls through the HTTP client; do not link OpenSSL.
    { name = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
