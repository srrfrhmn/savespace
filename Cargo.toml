[workspace]
resolver = "3"
members = ["crates/*", "bindings/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
repository = "https://github.com/srrfrhmn/savespace"

[workspace.dependencies]
# Internal crates
savespace-core = { path = "crates/core" }
platform-db = { path = "crates/platform-db" }
platform-observability = { path = "crates/platform-observability" }
domain-identity = { path = "crates/domain-identity" }
domain-ledger = { path = "crates/domain-ledger" }
domain-sync = { path = "crates/domain-sync" }
domain-categorize = { path = "crates/domain-categorize" }
domain-recurring = { path = "crates/domain-recurring" }
domain-insights = { path = "crates/domain-insights" }
domain-notify = { path = "crates/domain-notify" }
aggregator-plaid = { path = "crates/aggregator-plaid" }

# Third-party crates. Pin versions here only.
anyhow = "1.0.104"
axum = "0.8.9"
cargo_metadata = "0.23.1"
http-body-util = "0.1.5"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uniffi = "0.32.2"
uuid = { version = "1.29.0", features = ["v7"] }
wasm-bindgen = "0.2.130"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.savespace-core-wasm]
opt-level = "z"
