[workspace]
resolver = "3"
members = ["crates/*", "bindings/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates. Add a domain crate here when another crate first depends on it.
savespace-core = { path = "crates/core" }
platform-db = { path = "crates/platform-db" }
platform-observability = { path = "crates/platform-observability" }
platform-crypto = { path = "crates/platform-crypto" }
domain-identity = { path = "crates/domain-identity" }
domain-sync = { path = "crates/domain-sync" }
domain-categorize = { path = "crates/domain-categorize" }
domain-ledger = { path = "crates/domain-ledger" }
domain-recurring = { path = "crates/domain-recurring" }
aggregator-plaid = { path = "crates/aggregator-plaid" }

# Third-party crates. Pin versions here only.
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }

base64 = "0.23.1"
cargo_metadata = "0.23.1"
hex = "0.4.3"
http-body-util = "0.1.5"
jiff = { version = "1.0.0", features = ["serde", "tzdb-bundle-always"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
proptest = "1.12.0"
rand = "0.10.4"
# rustls with the ring provider (already used by sqlx). No aws-lc-rs C build.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "json", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "fs", "set-header"] }
tracing = "0.1.44"
tracing-stackdriver = "0.10.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uniffi = "0.32.2"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
wasm-bindgen = "0.2.130"
zeroize = "1.9.1"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.savespace-core-wasm]
opt-level = "z"
